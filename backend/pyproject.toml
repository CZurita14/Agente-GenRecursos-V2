[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genrecursos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anyio>=4,<5",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "psycopg[binary]>=3.2.10",
    "openai>=1.100",
    "httpx>=0.28",
    "PyYAML>=6.0.2",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "reportlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2",
    "scikit-learn>=1.5",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# pdfplumber: las pruebas de exportación leen el PDF generado (la API ya no lee PDF).
dev = ["pytest>=8.4", "pdfplumber>=0.11"]
ciencia = [
    "sentence-transformers>=3",
    "torch",
    "onnx",
    "onnxscript",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "servidor: requiere el servidor de IA real",
    "modelo: requiere el modelo base en caché",
]
